# Conda environment for TS-MoE on a typical NVIDIA GPU server.
# Runtime dependency: PyTorch only (stdlib otherwise).
#
# This file only creates Python + pip. Install the CUDA 12.4 PyTorch
# wheel with pip afterwards (see README §1). Pip wheels statically link
# MKL, which avoids the conda-side `iJIT_NotifyEvent` ImportError that
# hits dynamically-linked `pytorch` + mismatched `mkl` / `intel-openmp`.
#
# Assumes a recent NVIDIA driver that can run CUDA 12.4 toolkit builds
# (you do not need a full local CUDA toolkit). For older drivers, use a
# different pip index (cu121 / cu118) — see README.
name: tsmoe
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
