# Single source of truth for climb config/results retention.
# After locking a new WIN (or starting a new active wave), run:
#   python scripts/sync_climb_retention.py --city melbourne --lock-config configs/melbourne/..._win.yaml \
#       --results-tag <eval_run_dir> --acc 0.17xx --keep-wave w18 --apply
# Or just re-sync from this file:
#   python scripts/sync_climb_retention.py --apply
#
# Prune tools read this file (do not hardcode city WIN lists in two places).
# Intermediate densify waves (*_wNN_*) are gitignored; only lock WIN configs belong in git.
# Promote with: python scripts/promote_climb_config.py --city … --config … --acc … --git-add

sthgcn:
  tokyo: 0.250
  shanghai: 0.193
  beijing: 0.453
  melbourne: 0.168
  palembang: 0.246

cities:
